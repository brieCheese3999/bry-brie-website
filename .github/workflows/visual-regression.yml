name: Visual Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate_baselines:
        description: Generate Linux screenshots for review (does not approve them)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  responsive-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install matching Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check responsive layout and user journeys
        run: npx playwright test tests/layout.spec.ts tests/ui-journeys.spec.ts
      - name: Generate Linux baselines for review
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_baselines }}
        run: npx playwright test tests/responsive.spec.ts --project=chromium --update-snapshots
      - name: Compare approved visual baselines
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.generate_baselines) }}
        run: npx playwright test tests/responsive.spec.ts --project=chromium --update-snapshots=none
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            playwright-report/
            test-results/
            tests/responsive.spec.ts-snapshots/*-linux.png
          retention-days: 14
