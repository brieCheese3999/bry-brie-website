  <!-- scalloped ridge line (the "ridges" from the original circular frame): an
       arcade of 16 bumps, one cresting over each motif, with cusps at the
       midpoints. Valleys land at x = 62.5*m (incl. 0 and 1000) so it tiles. -->
  <path fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" d="M0,85
    Q31.25,61 62.5,85 Q93.75,61 125,85 Q156.25,61 187.5,85"/>

  <!-- 16 motifs, centers at 31.25 + k*62.5 (dx = center-500, dy = -2.5 -> y=100).
       Half a period of margin on each end so the rhythm carries across the seam. -->
  <use xlink:href="#motif" transform="translate(-468.75,-2.5)"/>
  <use xlink:href="#motif" transform="translate(-406.25,-2.5)"/>
  <use xlink:href="#motif" transform="translate(-343.75,-2.5)"/>
</svg>
